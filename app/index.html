<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070E1C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Your portal | SOLVD</title>
    <meta name="description" content="The Gym Portal dashboard for your gym." />
    <!-- A signed-in dashboard has nothing to offer search. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..500&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/portal.css" />
  </head>

  <!-- The account shell loads authorized data from the live portal API. -->

  <body class="demo" data-portal="account">
    <div class="stage">
      <div class="return-pill is-account">
        <span class="pulse"></span>
        <span data-account-label>Your portal</span>
        <button class="return-tag" type="button" data-signout>Log out</button>
      </div>

      <noscript>
        <div class="noscript">
          <p>
            The portal is an interactive app and needs JavaScript to render.
          </p>
          <p><a href="/">Return to SOLVD</a></p>
        </div>
      </noscript>

      <div class="app">
        <aside class="rail">
          <div class="rail-brand">
            <img src="/solvd-wordmark.png" alt="SOLVD" width="292" height="56" />
            <p class="label-mono" id="product-label"></p>
          </div>

          <button class="gym" type="button">
            <span class="gym-mark" id="gym-mark"></span>
            <span class="gym-name" id="gym-name">
              <span class="gym-sub" id="gym-members"></span>
            </span>
            <svg class="icon" aria-hidden="true"><use href="#i-chevron" /></svg>
          </button>

          <nav class="rail-nav" id="rail-nav" aria-label="Portal sections"></nav>

          <div class="rail-foot">
            <span class="avatar" id="user-initials"></span>
            <span class="who">
              <strong id="user-name"></strong>
              <span class="gym-sub" id="user-role"></span>
            </span>
          </div>
        </aside>

        <div class="workspace">
          <header class="topbar">
            <div class="topbar-title">
              <p class="label-mono" id="view-eyebrow"></p>
              <h1 id="view-title"></h1>
            </div>

            <div class="topbar-tools">
              <div class="range" id="range" role="group" aria-label="Date range"></div>
              <label class="search">
                <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
                <input type="search" id="portal-search" aria-label="Search this view" />
              </label>
              <p class="sync"><span class="pulse"></span> <span id="sync-label"></span></p>
            </div>
          </header>

          <div class="views" id="views"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/portal.js"></script>
  </body>
</html>
