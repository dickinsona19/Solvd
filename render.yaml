services:
  - type: web
    name: solvd-inbox-api
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SOLVD_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: solvd-inbox-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: SOLVD_ACCOUNT_ID
        value: test
      - key: SOLVD_ACCOUNT_USERNAME
        sync: false
      - key: SOLVD_ACCOUNT_PASSWORD
        sync: false
      - key: SOLVD_SESSION_SECRET
        generateValue: true
      - key: SOLVD_EMAIL_WEBHOOK_SECRET
        generateValue: true
      - key: SOLVD_ALLOWED_ORIGINS
        sync: false
      - key: SOLVD_IMAP_HOST
        value: imap.gmail.com
      - key: SOLVD_IMAP_PORT
        value: 993
      - key: SOLVD_IMAP_USERNAME
        sync: false
      - key: SOLVD_IMAP_PASSWORD
        sync: false
      - key: SOLVD_EMAIL_POLL_SECONDS
        value: 15
      - key: SOLVD_SORT_MODEL
        value: gpt-5.6-luna
      - key: SOLVD_DRAFT_MODEL
        value: gpt-5.6-luna

databases:
  - name: solvd-inbox-db
    plan: basic-256mb
    region: virginia
    databaseName: solvd
    user: solvd
